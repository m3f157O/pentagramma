title: Discovery Command Chain (correlation base)
name: sandbox_discovery_command_event
status: experimental
description: >
    Base rule for the discovery-chain correlation: one execution of a classic
    host/network recon command (tasklist, systeminfo, ipconfig, netstat,
    whoami, reg query, wmic get, net user/group, ...). Never alerts on its
    own -- it exists only to be counted by the correlation below.
author: sandbox
logsource:
    product: windows
    category: process_creation
detection:
    selection_tools:
        Image|endswith:
            - '\tasklist.exe'
            - '\systeminfo.exe'
            - '\ipconfig.exe'
            - '\netstat.exe'
            - '\whoami.exe'
            - '\qwinsta.exe'
            - '\quser.exe'
            - '\arp.exe'
            - '\driverquery.exe'
            - '\nltest.exe'
            - '\hostname.exe'
    selection_reg_query:
        Image|endswith: '\reg.exe'
        CommandLine|contains: ' query'
    selection_wmic_get:
        Image|endswith: '\wmic.exe'
        CommandLine|contains: ' get'
    selection_net:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains:
            - ' user'
            - ' group'
            - ' localgroup'
            - ' view'
            - ' accounts'
            - ' statistics'
    condition: 1 of selection_*
level: informational
