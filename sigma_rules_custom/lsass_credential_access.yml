title: LSASS Process Access (Possible Credential Dumping)
id: c0f1a2b3-5555-4a00-9c05-5a0dbea50b05
status: experimental
description: >
    A process outside the standard system directories opened lsass.exe with a
    memory-read / full-access mask typical of credential dumpers (Mimikatz,
    comsvcs MiniDump, etc.). Added after the detection-quality harness
    (tests/test_detection_quality.py) showed raw LSASS access scoring only
    "clean" -- two low-weight heuristic alerts and no rule. The source-path
    filter keeps routine system access (wininit/services/AV) from firing.
author: sandbox
date: 2026/07/03
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
    access:
        GrantedAccess:
            - '0x1010'
            - '0x1018'
            - '0x1038'
            - '0x1400'
            - '0x1410'
            - '0x1418'
            - '0x1438'
            - '0x143a'
            - '0x1f0fff'
            - '0x1f1fff'
            - '0x1f2fff'
            - '0x1f3fff'
    # Exclude the SPECIFIC processes that open lsass as part of normal
    # operation -- NOT a blanket System32 exclusion, which would also suppress
    # powershell/rundll32/tool-based dumping (the exact thing we want).
    filter_benign:
        SourceImage|endswith:
            - '\wininit.exe'
            - '\lsass.exe'
            - '\csrss.exe'
            - '\services.exe'
            - '\svchost.exe'
            - '\MsMpEng.exe'
            - '\wmiprvse.exe'
    condition: selection and access and not filter_benign
falsepositives:
    - EDR/AV or backup agents that legitimately read lsass from an unusual path
level: high
