title: CredSSP AllowEncryptionOracle Weakened (Mitigation Bypass)
id: c0f1a2b3-9999-4a00-9c09-5a0dbea50b09
status: experimental
description: >
    CredSSP\Parameters\AllowEncryptionOracle set to 2 -- re-enables the
    vulnerable CredSSP mode (CVE-2018-0886 mitigation bypass), seen in
    Scarab ransomware defense-evasion batches (ART T1112 atomic) and in
    lateral-movement prep.
author: sandbox
date: 2026/09/20
tags:
    - attack.defense-evasion
    - attack.t1112
logsource:
    product: windows
    category: registry_set
detection:
    selection_key:
        TargetObject|endswith: 'CredSSP\Parameters\AllowEncryptionOracle'
    selection_val:
        Details|contains: '0x00000002'
    condition: all of selection_*
falsepositives:
    - 2018-era RDP workaround scripts (long obsolete)
level: high
