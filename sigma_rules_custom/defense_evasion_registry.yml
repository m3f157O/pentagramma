title: Prefetch Disabled via Registry
id: c0f1a2b3-8888-4a00-9c08-5a0dbea50b08
status: experimental
description: >
    EnablePrefetcher set to 0 -- disables execution forensics, a defense
    evasion step (ART T1112 atomic). Essentially no modern legitimate
    software disables Prefetch (the 2010-era "SSD optimizer" advice is long
    dead); scored high so a single hit reaches suspicious.
author: sandbox
date: 2026/09/20
tags:
    - attack.defense-evasion
    - attack.t1112
logsource:
    product: windows
    category: registry_set
detection:
    selection_key:
        TargetObject|endswith: 'PrefetchParameters\EnablePrefetcher'
    selection_val:
        Details|contains: '0x00000000'
    condition: all of selection_*
falsepositives:
    - Ancient SSD-tweaker tools
level: high
