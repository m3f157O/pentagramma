title: FSUtil USN DeleteJournal
id: c0f1a2b3-aaaa-4a00-9c0a-5a0dbea50b0a
status: experimental
description: >
    fsutil usn deletejournal -- destroys the USN change journal to erase
    forensic traces of file activity; ransomware precursor (ART T1070
    atomic). Deliberately scoped to deletejournal only: other fsutil verbs
    (behaviorquery, volume info) are benign admin usage.
author: sandbox
date: 2026/09/20
tags:
    - attack.defense-evasion
    - attack.t1070
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith: '\fsutil.exe'
    selection_cmd:
        CommandLine|contains|all:
            - 'usn'
            - 'deletejournal'
    condition: all of selection_*
falsepositives:
    - Practically none; destructive maintenance only
level: high
